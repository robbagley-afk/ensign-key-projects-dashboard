<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Ensign Forest Green Tile Gradient -->
    <linearGradient id="kpBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022B1D" />
      <stop offset="45%" stop-color="#004731" />
      <stop offset="100%" stop-color="#056B47" />
    </linearGradient>

    <!-- Warm Gold / Amber Border Gradient -->
    <linearGradient id="kpBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Faceted Gold Star Gradient -->
    <linearGradient id="kpGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="kpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base App Tile: Forest Green -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#kpBgGrad)" filter="url(#kpShadow)" />
  <!-- Radiant Gold Ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#kpBorderGrad)" stroke-width="18" />

  <!-- Eisenhower 2x2 Grid Background -->
  <g opacity="0.30">
    <line x1="120" y1="256" x2="392" y2="256" stroke="#FEF08A" stroke-width="6" stroke-dasharray="10 8" />
    <line x1="256" y1="120" x2="256" y2="392" stroke="#FEF08A" stroke-width="6" stroke-dasharray="10 8" />
  </g>

  <!-- 4 Colored Eisenhower Quadrant Blocks -->
  <rect x="125" y="125" width="108" height="108" rx="20" fill="#EF4444" opacity="0.88" />
  <rect x="279" y="125" width="108" height="108" rx="20" fill="#10B981" opacity="0.95" />
  <rect x="125" y="279" width="108" height="108" rx="20" fill="#F59E0B" opacity="0.88" />
  <rect x="279" y="279" width="108" height="108" rx="20" fill="#475569" opacity="0.82" />

  <!-- Quadrant Inner Badges -->
  <!-- Q1 Urgent Fire -->
  <path d="M 179 155 C 179 155 194 172 186 189 C 197 178 197 163 197 163 C 197 163 205 178 201 197 C 196 211 181 215 170 204 C 161 195 166 178 179 155 Z" fill="#FFFFFF" />
  <!-- Q2 Strategic Mission Star -->
  <polygon points="333,150 339,166 356,169 342,180 347,197 333,186 319,197 324,180 310,169 327,166" fill="#FFFFFF" />
  <!-- Q3 Clock / Delegate -->
  <circle cx="179" cy="333" r="24" fill="none" stroke="#FFFFFF" stroke-width="6" />
  <polyline points="179,318 179,333 192,333" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <!-- Q4 Archive Folder -->
  <rect x="317" y="322" width="32" height="26" rx="5" fill="none" stroke="#FFFFFF" stroke-width="6" />

  <!-- Prominent Central Discipleship Compass Star -->
  <g filter="url(#kpShadow)">
    <circle cx="256" cy="256" r="54" fill="#021C13" stroke="url(#kpBorderGrad)" stroke-width="8" />
    <!-- 8-point gold compass star -->
    <polygon points="256,212 267,245 300,256 267,267 256,300 245,267 212,256 245,245" fill="url(#kpGoldGrad)" />
    <!-- 4 minor diagonal star points -->
    <polygon points="256,234 263,249 278,256 263,263 256,278 249,263 234,256 249,249" fill="#FFFBEB" opacity="0.8" />
  </g>

  <!-- Top Banner Label -->
  <text x="256" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="25" font-weight="900" fill="#FEF08A" text-anchor="middle" letter-spacing="3">KEY PROJECTS</text>
</svg>